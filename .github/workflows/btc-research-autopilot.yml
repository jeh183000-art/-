name: BTC Research Autopilot Controller

on:
  push:
    branches: [main]
    paths:
      - "btc-mailbox/inbox/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-research-autopilot-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run OpenAI research controller
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python btc-mailbox/controller/controller.py

      - name: Commit next task/state
        run: |
          git config user.name "btc-research-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-mailbox/outbox btc-mailbox/state
          if git diff --cached --quiet; then
            echo "No controller changes to commit."
          else
            git commit -m "btc-mailbox: queue next autonomous research task"
            git push
          fi
